[mod-setting-description]
disable-new-music=Отключить новую космическую музыку, добавленную модом. Жаль, что она вам не понравилась(
# Void data learning (part 3)
voidp-learnable-scope=Предметы, для которых есть диск данных пустоты. Научные пакеты: входы лабораторий, которые нужны хотя бы 3 технологиям и входят не больше чем в 30 рецептов. Другие моды дописывают предметы в список mod-data «voidp-learnable-items».
voidp-final-quality=Пустотное качество выше легендарного и восхождение дисков у Оратля. Если выключить на сохранении, пустотные предметы пропадут или станут другого качества.

[quality-name]
voidp-void=Пустотное

[quality-description]
voidp-void=Выше легендарного. Получается только восхождением легендарного диска данных пустоты у Оратля. Научные пакеты этого качества дают в 10 раз больше исследований.

