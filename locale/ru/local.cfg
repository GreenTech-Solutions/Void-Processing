[space-location-description]
black-hole=Чёрная дыра, обнаруженная на пути к разрушенной планете. Вокруг неё не видно ни одного астероида, но, возможно, она может быть полезна для чего-то другого... Эта красавица стоит того, чтобы отклониться от курса, не так ли?

