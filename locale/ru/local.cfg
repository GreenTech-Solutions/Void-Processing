[recipe-description]
promethium-crushing=Дробление прометия на маленькие куски, которыми проще манипулировать.
void-core-inert-rebuild=Восстанавливает структуру пустотного ядра до первозданного состояния. Этот процесс возможен только в условиях отсутствия гравитации.
void-pylon-tuned=Настроить пилон, чтобы слушать Оратль (и проклинать движок игры за то, что он усложняет создание рецептов с привязкой к месту в космосе).
# Void data learning (part 3)
void-learning=Диск получает качество рецепта. Пустой диск всегда обычный.
void-disk-refining=50 %: диск на ступень выше, до легендарного. 40 %: без изменений. 10 %: теряется. Легендарный диск здесь выше не поднимается.
void-disk-ascension=Настроенный пилон пустоты у Оратля. 25 %: легендарный диск становится пустотным, иначе теряется.
void-synthesis=Делает предмет качества диска. Диск возвращается в 99 % крафтов.

