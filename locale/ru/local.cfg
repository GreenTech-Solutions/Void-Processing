void-assembler=Сборочный автомат, пустотное издание.
void-pylon=Способен превращать материю в данные. Это и есть то, что называется "глубоким обучением"?
# Void data learning (part 3)
void-data-disk-of=Хранит то, что пилон пустоты узнал о предмете «__1__». Синтез из пустоты делает предмет качества диска.

