void-bacteria=Мутировавшие бактерии, способные превращать предметы в пустоту. Не могут долго существовать вне своего субстрата.
voidp-void-science-pack=Если долго всматриваться в пустотный исследовательский пакет, пустотный исследовательский пакет попросит положить его уже в эту чёртову лабораторию.

